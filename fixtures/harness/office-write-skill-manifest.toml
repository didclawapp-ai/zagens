# Office write skill — harness contract (Phase 2a.1 fixture)
# Aligns with docs/harness/skill-manifest-schema.md
# Pilot for Phase 2a.3 readback verify (write → readback → finalize)

schema_version = 1

[harness]
id = "office-write"
description = "Draft and write Office documents with mandatory readback verify before re-write."

[verify_budget]
max_retries = 2
timeout_ms = 120000

[rollback]
strategy = "snapshot"

[[stages]]
id = "prepare"
tools = ["read_office", "load_office_payload", "glob_files", "read_file", "list_dir"]

[[stages]]
id = "write"
tools = ["write_office"]
requires = ["prepare"]

[[stages]]
id = "readback_verify"
tools = ["read_office", "assert_output_matches"]
requires = ["write"]

[[verify]]
stage = "write"
predicate = "file_count"
args = { glob = "deliverables/*.docx", min = 1 }

[[verify]]
stage = "readback_verify"
predicate = "file_count"
args = { glob = "deliverables/*.docx", min = 1 }
