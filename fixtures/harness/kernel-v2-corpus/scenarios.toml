# Kernel v2 golden 会话语料库 — 场景定义（M0.1）
#
# 固定场景集，覆盖三种批次形态（提案 §11 Phase 1 前置、§13 验收分桶）：
#   pure_read        — 纯读批次（read / grep / glob）
#   shell_degradable — 含可降级 shell 批次（rg / git status / ls 等只读命令，§8.1.1）
#   write            — 含写批次（edit / write / patch）
# 另含一个长 thinking 场景（投机执行收益场景，M4.5 评估输入）。
#
# 复用 [[task]] 表名以对齐 lht_harness_util.py 的 load-tasks 约定；
# batch_shape / long_thinking / git_init 为本语料库的扩展字段。
#
# 回放： .\scripts\kernel-v2-corpus-run.ps1            （全部场景）
#        .\scripts\kernel-v2-corpus-run.ps1 -TaskId read-three-files
# 产出： results/kernel-v2-corpus/<label>/report.json （每步时延 JSON + 分桶汇总）

[meta]
schema_version = 1
description = "Kernel v2 baseline corpus: per-batch-shape step latency scenarios"
suite_ref = "doc_Private/docs/tech/AGENT_KERNEL_V2_TIER1_PLAN.md (M0.1)"

# ── pure_read：纯读批次 ──────────────────────────────────────────────

[[task]]
id = "read-three-files"
batch_shape = "pure_read"
turn_timeout_sec = 600
workspace_seed = "fixtures/harness/kernel-v2-corpus/workspace-seed"
prompt = """
阅读本工作区的 README.md、src/lib.rs、docs/design.md 三个文件，然后用 5 句话以内总结这个项目的模块结构与处理流程。
约束：只允许使用文件读取类工具（read/glob/grep），禁止运行任何 shell 命令，禁止修改任何文件，禁止派生子代理。可以一次性请求多个文件读取。
"""

[[task]]
id = "grep-glob-survey"
batch_shape = "pure_read"
turn_timeout_sec = 600
workspace_seed = "fixtures/harness/kernel-v2-corpus/workspace-seed"
prompt = """
完成两件事：1) 用搜索工具找出代码中所有 TODO 与 FIXME 注释，逐条列出文件与内容；2) 列出 src/ 下全部 .rs 文件。
约束：只允许 read/grep/glob 类工具，禁止 shell，禁止写文件，禁止子代理。两类查询可以并行发起。
"""

[[task]]
id = "read-compare-modules"
batch_shape = "pure_read"
turn_timeout_sec = 600
workspace_seed = "fixtures/harness/kernel-v2-corpus/workspace-seed"
prompt = """
阅读 src/lexer.rs 与 src/parser.rs 两个文件，对比并列出两者的全部 pub 函数与 pub 类型签名，并指出 parser 依赖 lexer 的哪些项。
约束：只允许文件读取类工具（read/grep/glob），禁止 shell，禁止写文件，禁止子代理。两个文件可以并行读取。
"""

# 长 thinking 场景：先深入推理再小批量读取——用于评估流内投机执行收益（M4.5）。
[[task]]
id = "read-long-thinking"
batch_shape = "pure_read"
long_thinking = true
turn_timeout_sec = 900
workspace_seed = "fixtures/harness/kernel-v2-corpus/workspace-seed"
prompt = """
请先深入思考再行动：docs/design.md 声称 util.rs 位于依赖图最底层、不得反向依赖其他模块。
请通过阅读全部 src/*.rs 文件验证该声明是否成立；同时分析若要给 eval.rs 实现一等函数（闭包捕获环境），现有 Env 设计需要哪些结构性调整，给出至少两种方案并比较优劣。
约束：只允许文件读取类工具（read/grep/glob），禁止 shell，禁止写文件，禁止子代理。
"""

# ── shell_degradable：含可降级 shell 批次（只读命令） ────────────────

[[task]]
id = "shell-git-status"
batch_shape = "shell_degradable"
git_init = true
turn_timeout_sec = 600
workspace_seed = "fixtures/harness/kernel-v2-corpus/workspace-seed"
prompt = """
用 shell 运行 `git status` 与 `git log --oneline -n 5`，汇报当前工作区的 git 状态与最近提交。
约束：只允许运行这两条只读命令，禁止任何修改类命令（add/commit/rm 等），禁止写文件，禁止子代理。
"""

[[task]]
id = "shell-rg-search"
batch_shape = "shell_degradable"
turn_timeout_sec = 600
workspace_seed = "fixtures/harness/kernel-v2-corpus/workspace-seed"
prompt = """
用 shell 运行 rg（ripgrep）在本工作区统计标识符 parse 出现的次数（例如 `rg -c parse`），再用 `rg -n "pub fn"` 列出所有公开函数定义的位置，最后汇总两项结果。
约束：只允许只读 shell 命令（rg/ls/cat 类），禁止修改任何文件，禁止子代理。若 rg 不可用，可改用等价的只读搜索命令并说明。
"""

[[task]]
id = "shell-list-files"
batch_shape = "shell_degradable"
turn_timeout_sec = 600
workspace_seed = "fixtures/harness/kernel-v2-corpus/workspace-seed"
prompt = """
用 shell 完成：1) 递归列出工作区全部文件（如 `ls -R` 或等价命令）；2) 查看 Cargo.toml 的内容（如 `cat Cargo.toml`）。然后报告项目的文件清单与包元数据。
约束：只允许只读 shell 命令，禁止修改任何文件，禁止子代理。
"""

# ── write：含写批次 ──────────────────────────────────────────────────

[[task]]
id = "write-append-readme"
batch_shape = "write"
turn_timeout_sec = 1200
workspace_seed = "fixtures/harness/kernel-v2-corpus/workspace-seed"
prompt = """
在 README.md 文件末尾追加一个二级标题章节：`## Changelog`，正文一行：`- 0.1.0: initial corpus seed`。不要改动文件的其他任何部分。
完成后读回文件确认追加成功。禁止 shell，禁止子代理。
"""

[[task]]
id = "write-new-doc"
batch_shape = "write"
turn_timeout_sec = 1200
workspace_seed = "fixtures/harness/kernel-v2-corpus/workspace-seed"
prompt = """
新建文件 docs/NOTES.md，内容为：一级标题 `# Corpus Notes`，正文两行列表：`- generated by kernel-v2 corpus run` 与 `- safe to delete`。
完成后读回文件确认内容正确。禁止 shell，禁止子代理。
"""

[[task]]
id = "write-rename-fn"
batch_shape = "write"
turn_timeout_sec = 900
workspace_seed = "fixtures/harness/kernel-v2-corpus/workspace-seed"
prompt = """
把 src/util.rs 中的公开函数 render_span 重命名为 render_caret，并同步更新仓库中所有引用它的位置（包括 re-export 与文档提及）。
先用搜索工具找全引用点，再逐处修改，最后再次搜索确认没有残留的 render_span。禁止 shell，禁止子代理。
"""
