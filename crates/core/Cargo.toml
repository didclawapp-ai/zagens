[package]
name = "deepseek-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core runtime boundaries for DeepSeek workspace architecture"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
deepseek-config = { path = "../config", version = "0.8.15" }
deepseek-execpolicy = { path = "../execpolicy", version = "0.8.15" }
deepseek-protocol = { path = "../protocol", version = "0.8.15" }
deepseek-tools = { path = "../tools", version = "0.8.15" }
futures-util = { version = "0.3", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
schemars = { version = "1.2.1", features = ["derive"] }
tokio = { workspace = true, features = ["sync", "macros", "time", "rt"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
uuid.workspace = true
ignore = "0.4"
regex = "1.11"
thiserror.workspace = true
toml.workspace = true
dirs.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3.16"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
