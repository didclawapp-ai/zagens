[package]
name = "deepseek-runtime-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runtime thread/turn persist layer for DeepSeek sidecar (D16 E1-b)"

[lib]
name = "deepseek_runtime_orchestrator"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
deepseek-core = { path = "../core", version = "0.8.15" }
deepseek-protocol = { path = "../protocol", version = "0.8.15" }
deepseek-runtime-adapters = { path = "../runtime-adapters", version = "0.8.15" }
rusqlite.workspace = true
schemars = { version = "1.2.1", features = ["derive", "preserve_order", "chrono04"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.16"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints.rust]
dead_code = "allow"
