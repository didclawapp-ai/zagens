[package]
name = "zagens-runtime-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Runtime thread/turn persist layer for Zagens sidecar (D16 E1-b)"

[lib]
name = "zagens_runtime_orchestrator"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
anyhow.workspace = true
chrono.workspace = true
zagens-core = { path = "../core", version = "0.8.7" }
zagens-protocol = { path = "../protocol", version = "0.8.7" }
zagens-runtime-adapters = { path = "../runtime-adapters", version = "0.8.7" }
zagens-tools = { path = "../tools", version = "0.8.7" }
futures-util = "0.3.31"
rusqlite.workspace = true
schemars = { version = "1.2.1", features = ["derive", "preserve_order", "chrono04"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.16"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints.rust]
dead_code = "allow"