[package]
name = "deepseek-runtime-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runtime tool/MCP/persist adapters for DeepSeek sidecar (D16 E1-a)"

[lib]
name = "deepseek_runtime_adapters"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
deepseek-config = { path = "../config", version = "0.8.15" }
deepseek-core = { path = "../core", version = "0.8.15" }
deepseek-protocol = { path = "../protocol", version = "0.8.15" }
dirs.workspace = true
futures-util = "0.3.31"
reqwest = { workspace = true, features = ["blocking", "stream", "multipart", "http2"] }
rusqlite.workspace = true
schemars = { version = "1.2.1", features = ["derive", "preserve_order", "chrono04"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
similar = "2"
ignore = "0.4"
tempfile = "3.16"
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7.16", features = ["io"] }
toml.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.16"

[lints.rust]
dead_code = "allow"
