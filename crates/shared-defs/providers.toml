# schema_version = 1
# Single source for provider identity / defaults / keyring / env overrides.
# Regenerate: `just providers` → checked-in Rust modules + example fragment.
# Custom providers stay dynamic (not listed). vision is keyring-only (not a chat provider).

[[provider]]
id = "deepseek"
rust_variant = "Deepseek"
aliases = ["deep-seek"]
display_name = "DeepSeek"
default_base_url = "https://api.deepseek.com/beta"
default_model = "deepseek-v4-pro"
keyring_slot = "deepseek"
env_api_key = ["DEEPSEEK_API_KEY"]
env_base_url = ["DEEPSEEK_BASE_URL"]
env_model = ["DEEPSEEK_MODEL", "DEEPSEEK_DEFAULT_TEXT_MODEL"]
# Write DEEPSEEK_BASE_URL to root `base_url` (not providers.deepseek).
base_url_writes_root = true
# DEEPSEEK_MODEL applies globally (any active provider), matching historical runtime.
model_env_global = true
toml_field = "deepseek"
show_in_desktop_presets = true
desktop_section = "primary"
catalog_picker = false
docs_url = "https://platform.deepseek.com/api_keys"

[[provider]]
id = "deepseek-cn"
rust_variant = "DeepseekCN"
aliases = ["deepseek_china", "deepseekcn", "deepseek-china"]
display_name = "DeepSeek (中国)"
default_base_url = "https://api.deepseeki.com"
default_model = "deepseek-v4-pro"
keyring_slot = "deepseek"
env_api_key = ["DEEPSEEK_API_KEY"]
# Shares DeepSeek root env overrides (no separate CN_* vars).
toml_field = "deepseek_cn"
runtime_only = true
show_in_desktop_presets = false
catalog_picker = false

