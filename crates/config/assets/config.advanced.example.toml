# ║  NOT loaded automatically — copy snippets into ~/.zagens/config.toml,        ║
# ║  then restart the runtime sidecar (Zagens relaunch or sidecar restart).      ║
# ║                                                                              ║
# ║  Zagens UI stays on DeepSeek V4 by default. Other models are experimental:   ║
