<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zagens">
  <defs>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9af7ee"/>
      <stop offset="45%" stop-color="#3ec9c0"/>
      <stop offset="100%" stop-color="#2a7f9e"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#7ef0e4"/>
      <stop offset="50%" stop-color="#4a8fff"/>
      <stop offset="100%" stop-color="#3ec9c0"/>
    </linearGradient>
    <radialGradient id="discN" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#1a2a3d"/>
      <stop offset="100%" stop-color="#0b1018"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

