[package]
name = "deepseek-desktop"
# DS Pick is versioned independently of the workspace (CLI/TUI) line — see CHANGELOG.md.
version = "0.2.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "DS Pick — Tauri GUI shell for DeepSeek TUI (deepseek CLI)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
deepseek-config = { path = "../config", version = "0.8.15" }
toml.workspace = true
anyhow.workspace = true
serde.workspace = true
base64 = "0.22"
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time", "sync"] }
uuid.workspace = true
# `devtools`: keeps WebView 开发者工具在 release 也可用，并注入 Ctrl+Shift+I 切换脚本（见 Tauri 文档）。
tauri = { version = "2", features = ["devtools", "tray-icon", "image-ico"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
tauri-plugin-shell = "2"
ignore = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
