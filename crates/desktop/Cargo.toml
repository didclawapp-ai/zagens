[package]
name = "deepseek-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DeepSeek Desktop — Tauri-powered GUI shell for the DeepSeek coding agent"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
deepseek-config = { path = "../config", version = "0.8.15" }
toml.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time", "sync"] }
uuid.workspace = true
tauri = { version = "2", features = [] }
reqwest = { workspace = true, features = ["json", "rustls"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
