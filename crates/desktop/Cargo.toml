[package]
name = "zagens-desktop"
# Aligned with workspace runtime line at 0.7.4 — see CHANGELOG.md.
version = "0.8.5"
edition.workspace = true
description = "Zagens — Open-source agent harness for DeepSeek V4 (Tauri desktop + embedded runtime sidecar)"
license.workspace = true
rust-version.workspace = true

repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = false

[[bin]]
name = "zagens"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zagens-config = { path = "../config", version = "0.8.5" }
zagens-secrets = { path = "../secrets", version = "0.8.5" }
toml.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
base64 = "0.22"
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["process", "time", "sync"] }
uuid.workspace = true
# `devtools`: keeps WebView 开发者工具在 release 也可用，并注入 Ctrl+Shift+I 切换脚本（见 Tauri 文档）。
tauri = { version = "2", features = ["devtools", "tray-icon", "image-ico"] }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
futures-util = "0.3"
ignore = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tracing.workspace = true
dirs.workspace = true
portable-pty = "0.8"
open = "5.3"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
zagens-windows-sandbox = { path = "../windows-sandbox", version = "0.8.5" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
