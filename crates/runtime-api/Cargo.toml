[package]
name = "zagens-runtime-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Runtime HTTP/SSE OpenAPI surface for Zagens sidecar (D16 E1-c)"

[lib]
name = "zagens_runtime_api"
path = "src/lib.rs"

[dependencies]
chrono.workspace = true
zagens-core = { path = "../core", version = "0.8.9" }
zagens-protocol = { path = "../protocol", version = "0.8.9" }
zagens-runtime-adapters = { path = "../runtime-adapters", version = "0.8.9" }
zagens-runtime-orchestrator = { path = "../runtime-orchestrator", version = "0.8.9" }
axum.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
schemars = { version = "1.2.1", features = ["derive", "preserve_order", "chrono04"] }
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
pretty_assertions = "1.4"

[lints.rust]
dead_code = "allow"