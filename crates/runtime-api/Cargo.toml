[package]
name = "deepseek-runtime-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runtime HTTP/SSE OpenAPI surface for Zagens sidecar (D16 E1-c)"

[lib]
name = "deepseek_runtime_api"
path = "src/lib.rs"

[dependencies]
deepseek-core = { path = "../core", version = "0.8.15" }
deepseek-protocol = { path = "../protocol", version = "0.8.15" }
deepseek-runtime-adapters = { path = "../runtime-adapters", version = "0.8.15" }
deepseek-runtime-orchestrator = { path = "../runtime-orchestrator", version = "0.8.15" }
schemars = { version = "1.2.1", features = ["derive", "preserve_order", "chrono04"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
pretty_assertions = "1.4"

[lints.rust]
dead_code = "allow"
