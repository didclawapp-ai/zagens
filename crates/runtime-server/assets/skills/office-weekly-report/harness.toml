# Phase 2a.3 pilot — office weekly report staged gate + readback verify
# Loaded by `load_skill name=office-weekly-report` (harness.toml beside SKILL.md)

schema_version = 1

[harness]
id = "office-weekly-report"
description = "Weekly report: prepare → write → readback verify (write_office blocked until prior stages pass)."

[verify_budget]
max_retries = 2
timeout_ms = 120000

[rollback]
strategy = "snapshot"

[[stages]]
id = "prepare"
tools = [
  "read_office",
  "load_office_payload",
  "glob_files",
  "read_file",
  "list_dir",
  "request_user_input",
]

[[stages]]
id = "write"
tools = ["write_office"]
requires = ["prepare"]

[[stages]]
id = "readback_verify"
tools = ["read_office", "assert_output_matches"]
requires = ["write"]

[[verify]]
stage = "write"
predicate = "file_count"
args = { glob = "deliverables/*.docx", min = 1 }

[[verify]]
stage = "readback_verify"
predicate = "file_count"
args = { glob = "deliverables/*.docx", min = 1 }
