[package]
name = "deepseek-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Terminal UI for DeepSeek"
default-run = "deepseek-tui"

[features]
default = ["tui", "json", "toml"]
tui = ["dep:schemaui", "schemaui/tui", "json", "toml"]
web = ["dep:schemaui", "schemaui/web", "json", "toml"]
json = ["schemaui/json"]
toml = ["schemaui/toml"]

[lib]
name = "deepseek_tui"
path = "src/lib.rs"

[[bin]]
name = "deepseek-tui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard = "3.4"
deepseek-config = { path = "../config", version = "0.8.15" }
deepseek-core = { path = "../core", version = "0.8.15" }
deepseek-secrets = { path = "../secrets", version = "0.8.15" }
deepseek-protocol = { path = "../protocol", version = "0.8.15" }
deepseek-tools = { path = "../tools", version = "0.8.15" }
schemaui = { version = "0.12.0", default-features = false, optional = true }
async-stream = "0.3.6"
async-trait.workspace = true
base64 = "0.22.1"
axum.workspace = true
clap.workspace = true
clap_complete.workspace = true
colored = "3.0.0"
crossterm = "0.28"
dotenvy = "0.15.7"
dirs.workspace = true
fd-lock = "4.0.4"
futures-util = "0.3.31"
ratatui = "0.29"
regex = "1.11"
reqwest = { workspace = true, features = ["blocking", "stream", "multipart", "http2"] }
similar = "2"
rustyline = "15.0.0"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
schemars = { version = "1.2.1", features = ["derive", "preserve_order"] }
shellexpand = "3"
toml.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7.16", features = ["io"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
uuid.workspace = true
chrono.workspace = true
tempfile = "3.16"
thiserror.workspace = true
tracing.workspace = true
tower-http.workspace = true
wait-timeout = "0.2"
multimap = "0.10.0"
shlex = "1.3.0"
starlark = "0.13.0"
tiny_http = "0.12"
portable-pty = "0.8"
zeroize = "1.8.2"
ignore = "0.4"
globset = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
pdf-extract = "0.7"
tar = "0.4"
flate2 = "1.1"
sha2.workspace = true
rusqlite.workspace = true
encoding_rs = "0.8"
zip = "2.2"
rust_xlsxwriter = "0.81"

[dev-dependencies]
wiremock = "0.6"
pretty_assertions = "1.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug"] }
