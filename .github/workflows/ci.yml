name: CI

# PR-first CI (common OSS layout):
#   - pull_request → full verify matrix
#   - push release tag → full matrix (+ CD after green; see cd.yml)
#   - push to master/main → no workflow (merge was already checked on the PR)
# Maintainer docs: CONTRIBUTING.md § "CI when you push".

on:
  push:
    tags: ['zagens-v*', 'ds-pick-v*']
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:

# Least-privilege default token; no job here needs write access.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes. Don't cancel
# scheduled runs (each weekly cron run is independent and worth keeping).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -Dwarnings

jobs:
  versions:
    name: Version drift
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs; bump pins manually during
      # maintenance (no Dependabot — same policy as CodeWhale). dtolnay/rust-toolchain
      # ref name itself selects the toolchain, so SHA-pinning would defeat it.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh
      - name: Check version drift
        run: bash scripts/release/check-versions.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Assert pinned toolchain
        run: rustc --version | grep -F '1.96.0'
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Prefetch crate index (network retry)
        run: bash scripts/ci/cargo-retry.sh fetch --locked
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/desktop/web-ui/package-lock.json
      - name: Ensure web-ui dist (desktop clippy)
        run: bash scripts/ci/ensure-web-ui-dist.sh
      - name: Pre-build runtime sidecar (required by desktop build.rs)
        run: bash scripts/ci/cargo-retry.sh build -p zagens-cli --bin zagens-runtime --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (strict)
        run: bash scripts/ci/cargo-retry.sh clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Prefetch crate index (network retry)
        run: bash scripts/ci/cargo-retry.sh fetch --locked
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/desktop/web-ui/package-lock.json
      - name: Ensure web-ui dist (desktop tests)
        run: bash scripts/ci/ensure-web-ui-dist.sh
      - name: Pre-build runtime sidecar (required by desktop build.rs)
        run: bash scripts/ci/cargo-retry.sh build -p zagens-cli --bin zagens-runtime --locked
      - name: Run tests
        run: |
          bash scripts/ci/cargo-retry.sh test --workspace --all-features --locked --exclude zagens-cli
          bash scripts/ci/cargo-retry.sh test -p zagens-cli --lib --all-features --locked
      - name: Multi-session parallel streaming (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/ci/test-multi-session.sh
      - name: Runtime sidecar contract (A+.4 / R-009)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p zagens-cli --lib sidecar_contract_full_lifecycle --locked
      - name: Runtime sidecar binary contract (D6 Phase A+)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p zagens-cli --test sidecar_binary_contract --locked
      - name: Headless CLI binary contract
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p zagens-cli --test zagens_cli_contract --locked
      - name: Headless CLI exec mock integration
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p zagens-cli --lib exec_agent_json_e2e_with_mock_llm --locked
      - name: Reclaim disk before release build (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Disk before debug cleanup:"
          df -h /
          rm -rf target/debug
          echo "Disk after debug cleanup:"
          df -h /
      - name: Headless CLI release build smoke
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/ci/cargo-retry.sh build -p zagens-cli --release --locked --bin zagens --bin zagens-runtime --bin export-runtime-openapi
      - name: R-015 baseline dry-run (A1.6 disk proxy)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./scripts/runtime-longrun-baseline.ps1 -DryRun -Runs 3
      - name: L3 coverage-gate report (L7 harness regression smoke)
        if: matrix.os == 'ubuntu-latest'
        run: ./target/release/zagens coverage-gate --no-fail --json || true
      - name: Lockfile drift guard
        run: git diff --exit-code -- Cargo.lock
      - name: OpenAPI contract (D8 / D16 E5)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./target/release/export-runtime-openapi
          git diff --exit-code -- docs/tech/openapi/zagens-runtime-v1.openapi.json
      - name: OpenAPI TS types drift (D8 / D16 E5)
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/desktop/web-ui
        run: |
          npm ci --include=dev
          npm run generate:api-types
          git diff --exit-code -- src/api/generated/runtime-api.ts
      - name: Model catalog TS drift (shared-defs)
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/generate-model-catalog-ts.mjs
          git diff --exit-code -- crates/desktop/web-ui/src/lib/generated/modelCatalog.ts
      - name: Providers.toml generated Rust drift (shared-defs)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/generate-providers.py
          git diff --exit-code -- crates/config/src/generated crates/runtime-server/src/config/generated crates/secrets/src/generated crates/shared-defs/generated

  # Check documentation builds without warnings
  docs:
    name: Documentation
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Prefetch crate index (network retry)
        run: bash scripts/ci/cargo-retry.sh fetch --locked
      - name: Build docs
        run: bash scripts/ci/cargo-retry.sh doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
