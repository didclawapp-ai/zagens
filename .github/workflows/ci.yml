name: CI

on:
  push:
    branches: [master, main]
    tags: ['zagens-v*', 'ds-pick-v*']
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '31 6 * * 1'

# Least-privilege default token; no job here needs write access.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes. Don't cancel
# scheduled runs (each weekly cron run is independent and worth keeping).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  versions:
    name: Version drift
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs (Dependabot keeps them
      # fresh). dtolnay/rust-toolchain stays on the @1.96.0 version branch: the
      # ref name itself selects the toolchain, so SHA-pinning would defeat it.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh
      - name: Check version drift
        run: bash scripts/release/check-versions.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Assert pinned toolchain
        run: rustc --version | grep -F '1.96.0'
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Prefetch crate index (network retry)
        run: bash scripts/ci/cargo-retry.sh fetch --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/desktop/web-ui/package-lock.json
      - name: Ensure web-ui dist (desktop clippy)
        run: bash scripts/ci/ensure-web-ui-dist.sh
      - name: Pre-build runtime sidecar (required by desktop build.rs)
        run: bash scripts/ci/cargo-retry.sh build -p deepseek-runtime-server --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (strict)
        run: bash scripts/ci/cargo-retry.sh clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Prefetch crate index (network retry)
        run: bash scripts/ci/cargo-retry.sh fetch --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/desktop/web-ui/package-lock.json
      - name: Ensure web-ui dist (desktop tests)
        run: bash scripts/ci/ensure-web-ui-dist.sh
      - name: Pre-build runtime sidecar (required by desktop build.rs)
        run: bash scripts/ci/cargo-retry.sh build -p deepseek-runtime-server --locked
      - name: Run tests
        run: bash scripts/ci/cargo-retry.sh test --workspace --all-features --locked
      - name: Runtime sidecar contract (A+.4 / R-009)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p deepseek-runtime-server --lib sidecar_contract_full_lifecycle --locked
      - name: Runtime sidecar binary contract (D6 Phase A+)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p deepseek-runtime-server --test sidecar_binary_contract --locked
      - name: R-015 baseline dry-run (A1.6 disk proxy)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./scripts/runtime-longrun-baseline.ps1 -DryRun -Runs 3
      - name: Lockfile drift guard
        run: git diff --exit-code -- Cargo.lock
      - name: OpenAPI contract (D8 / D16 E5)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -p deepseek-runtime-server --locked --bin export-runtime-openapi
          git diff --exit-code -- docs/tech/openapi/zagens-runtime-v1.openapi.json
      - name: OpenAPI TS types drift (D8 / D16 E5)
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/desktop/web-ui
        run: |
          npm ci --include=dev
          npm run generate:api-types
          git diff --exit-code -- src/api/generated/runtime-api.ts

  # Check documentation builds without warnings
  docs:
    name: Documentation
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Prefetch crate index (network retry)
        run: bash scripts/ci/cargo-retry.sh fetch --locked
      - name: Build docs
        run: bash scripts/ci/cargo-retry.sh doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
