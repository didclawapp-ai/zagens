name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '31 6 * * 1'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  versions:
    name: Version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); retrying in 15s"
            sleep 15
          done
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check version drift
        run: ./scripts/release/check-versions.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); retrying in 15s"
            sleep 15
          done
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (strict)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); retrying in 15s"
            sleep 15
          done
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-features --locked
      - name: Runtime sidecar contract (A+.4 / R-009)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p deepseek-tui --lib sidecar_contract_full_lifecycle --all-features --locked
      - name: Runtime sidecar binary contract (D6 Phase A+)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p deepseek-runtime-server --test sidecar_binary_contract --locked
      - name: R-015 baseline dry-run (A1.6 disk proxy)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./scripts/runtime-longrun-baseline.ps1 -DryRun -Runs 3
      - name: Lockfile drift guard
        run: git diff --exit-code -- Cargo.lock
      - name: OpenAPI spec drift (D8)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -p deepseek-tui --no-default-features --features openapi-export,json,toml --locked --bin export-runtime-openapi
          git diff --exit-code -- docs/tech/openapi/zagens-runtime-v1.openapi.json
      - name: Run Offline Eval Harness
        run: cargo run -p deepseek-tui --all-features -- eval

  # Check documentation builds without warnings
  docs:
    name: Documentation
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); retrying in 15s"
            sleep 15
          done
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
