name: Zagens Release

# Desktop installer releases only (Windows for now; macOS/Linux can be added later).
# Push tag:  git tag zagens-v0.6.0-preview.1 && git push origin zagens-v0.6.0-preview.1
# Pre-1.0 Zagens SemVer — see CHANGELOG.md header; maintainer policy in doc_Private/docs/desktop/VERSIONING.md
# Legacy:   ds-pick-v* tags still trigger this workflow
# Manual:    Actions → Zagens Release → Run workflow
#
# Installers + OTA manifest are synced to zagens.com by the private website repo:
#   https://github.com/jjlin0603-svg/zagens_website

on:
  push:
    tags: ['zagens-v*', 'ds-pick-v*']
  workflow_dispatch:

# Least-privilege default; the publish job opts into `contents: write` below.
permissions:
  contents: read

# Never cancel an in-flight release — a half-published tag is worse than a
# duplicate run. Serialize per ref instead.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate the installer build on the same fmt/clippy/test checks as CI, so a
  # tag pushed to an unverified commit can't ship a broken release.
  verify:
    name: Verify (fmt + clippy + tests)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Install Linux system dependencies
        run: bash scripts/ci/install-linux-deps.sh
      - uses: Swatinem/rust-cache@v2
      - name: Prefetch crate index (network retry)
        run: bash scripts/ci/cargo-retry.sh fetch --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/desktop/web-ui/package-lock.json
      - name: Check version drift
        run: bash scripts/release/check-versions.sh
      - name: Ensure web-ui dist (desktop clippy)
        run: bash scripts/ci/ensure-web-ui-dist.sh
      - name: Pre-build runtime sidecar (required by desktop build.rs)
        run: bash scripts/ci/cargo-retry.sh build -p deepseek-runtime-server --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (strict)
        run: bash scripts/ci/cargo-retry.sh clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: bash scripts/ci/cargo-retry.sh test --workspace --all-features --locked

  build-windows:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install web-ui dependencies
        working-directory: crates/desktop/web-ui
        run: npm ci

      - name: Build Zagens (Windows)
        working-directory: crates/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      - name: Package installers (zip + SHA-256)
        working-directory: crates/desktop
        run: npm run package:release

      - name: Stage installer artifacts
        shell: pwsh
        working-directory: crates/desktop
        run: |
          $bundle = "target/release/bundle"
          if (-not (Test-Path $bundle)) {
            Write-Error "Missing bundle dir: $bundle"
          }
          New-Item -ItemType Directory -Force -Path ../../release-artifacts | Out-Null
          Get-ChildItem -Path $bundle -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe', '.zip', '.sha256', '.sig' } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination "../../release-artifacts/$($_.Name)"
            }
          if (-not (Get-ChildItem ../../release-artifacts)) {
            Write-Error "No installer artifacts found under $bundle"
          }
          Get-ChildItem ../../release-artifacts

      - name: Upload release artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-preview') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: release-artifacts/*
          body: |
            ## Zagens desktop (Windows)

            Installers attached to this release. macOS and Linux packages may be added in a future release.

            **Recommended download:** the `*-setup.exe.zip` archive. Because Zagens
            is not yet code-signed, Windows SmartScreen may warn on the raw `.exe`.
            **Right-click the downloaded `.zip` → Properties → check "Unblock" →
            extract → run the installer** for a prompt-free install. Verify the
            download with the matching `.sha256` file.

            OTA `latest.json` and zagens.com `/download/` are updated by the
            [zagens_website](https://github.com/jjlin0603-svg/zagens_website) repo
            after this release is published.

            See [SMARTSCREEN.md](../../blob/main/docs/desktop/SMARTSCREEN.md) for
            details, and [CHANGELOG.md](../../blob/main/CHANGELOG.md) for release notes.

  notify-website-release:
    name: Sync installers to zagens.com
    needs: build-windows
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch website sync-release workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_REPO_DISPATCH_TOKEN }}
          repository: jjlin0603-svg/zagens_website
          event-type: desktop-release
          client-payload: '{"tag": "${{ github.ref_name }}"}'
