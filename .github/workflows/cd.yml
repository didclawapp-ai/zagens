name: CD

# Continuous deployment: Windows installer → GitHub Release → zagens.com sync.
#
# Flow (tag release):
#   1. git tag zagens-v0.7.0 && git push origin zagens-v0.7.0
#   2. CI runs the full verify matrix on the tag (see ci.yml tag triggers)
#   3. This workflow starts after CI succeeds (workflow_run)
#   4. Build/sign/publish installers; dispatch website repo sync-release
#
# Manual smoke build (no publish): Actions → CD → Run workflow (any branch).
#
# Required secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   WEBSITE_REPO_DISPATCH_TOKEN (PAT with repo scope on zagens_website)
#
# Website sync: https://github.com/jjlin0603-svg/zagens_website

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (startsWith(github.event.workflow_run.head_branch, 'zagens-v') ||
        startsWith(github.event.workflow_run.head_branch, 'ds-pick-v')))
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Resolve release ref
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Check version drift
        run: bash scripts/release/check-versions.sh

      - name: Validate tag matches desktop manifest
        if: steps.meta.outputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          case "$TAG" in
            zagens-v*) VER="${TAG#zagens-v}" ;;
            ds-pick-v*) VER="${TAG#ds-pick-v}" ;;
            *)
              echo "::error::Unsupported release tag: $TAG"
              exit 1
              ;;
          esac
          DESKTOP="$(grep -E '^version = "' crates/desktop/Cargo.toml | head -n1 | sed -E 's/^version = "([^"]+)".*/\1/')"
          if [ "$VER" != "$DESKTOP" ]; then
            echo "::error::Tag version ($VER) does not match crates/desktop Cargo.toml ($DESKTOP)"
            exit 1
          fi
          echo "Release gate OK: tag=$TAG desktop=$DESKTOP sha=${{ steps.meta.outputs.sha }}"

  build-windows:
    name: Windows installer
    needs: gate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install web-ui dependencies
        working-directory: crates/desktop/web-ui
        run: npm ci

      - name: Build Zagens (Windows)
        working-directory: crates/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      - name: Package installers (zip + SHA-256)
        working-directory: crates/desktop
        run: npm run package:release

      - name: Stage installer artifacts
        shell: pwsh
        working-directory: crates/desktop
        run: |
          # Cargo workspace target dir is at repo root, not crates/desktop/
          $bundle = "../../target/release/bundle"
          if (-not (Test-Path $bundle)) {
            Write-Error "Missing bundle dir: $bundle (cwd: $(Get-Location))"
          }
          New-Item -ItemType Directory -Force -Path ../../release-artifacts | Out-Null
          Get-ChildItem -Path $bundle -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe', '.zip', '.sha256', '.sig' } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination "../../release-artifacts/$($_.Name)"
            }
          if (-not (Get-ChildItem ../../release-artifacts)) {
            Write-Error "No installer artifacts found under $bundle"
          }
          Get-ChildItem ../../release-artifacts

      - name: Upload release artifacts (CI)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts-${{ needs.gate.outputs.tag || github.run_id }}
          path: release-artifacts/
          retention-days: 14

      - name: Publish GitHub Release
        if: needs.gate.outputs.tag != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ needs.gate.outputs.sha }}
          prerelease: ${{ contains(needs.gate.outputs.tag, '-preview') || contains(needs.gate.outputs.tag, '-beta') || contains(needs.gate.outputs.tag, '-alpha') }}
          generate_release_notes: true
          files: release-artifacts/*
          body: |
            ## Zagens desktop (Windows)

            Installers attached to this release. macOS and Linux packages may be added in a future release.

            **Recommended download:** the `*-setup.exe.zip` archive. Because Zagens
            is not yet code-signed, Windows SmartScreen may warn on the raw `.exe`.
            **Right-click the downloaded `.zip` → Properties → check "Unblock" →
            extract → run the installer** for a prompt-free install. Verify the
            download with the matching `.sha256` file.

            ## Headless CLI (`zagens`)

            Cross-platform CLI binaries (`zagens`, `zagens-runtime`) and matching
            `.sha256` checksums are attached when the CLI matrix job succeeds.
            Install via Scoop or download the archive for your target triple.

            OTA `latest.json` and zagens.com `/download/` are updated by the
            [zagens_website](https://github.com/jjlin0603-svg/zagens_website) repo
            after this release is published.

            See [SMARTSCREEN.md](https://github.com/${{ github.repository }}/blob/${{ needs.gate.outputs.sha }}/docs/desktop/SMARTSCREEN.md) for
            details, and [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ needs.gate.outputs.sha }}/CHANGELOG.md) for release notes.

  build-cli:
    name: CLI binaries (${{ matrix.label }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-gnu
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows-msvc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Build release CLI binaries
        shell: bash
        run: bash scripts/release/build-cli-binaries.sh release-cli-artifacts

      - name: Upload CLI artifacts (CI)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-artifacts-${{ matrix.label }}-${{ needs.gate.outputs.tag || github.run_id }}
          path: release-cli-artifacts/
          retention-days: 14

  publish-cli-release:
    name: Attach CLI binaries to release
    needs: [gate, build-cli]
    if: needs.gate.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a81b294aae406fe1470e6438a7f566678875a # v4
        with:
          pattern: cli-artifacts-*-${{ needs.gate.outputs.tag }}
          path: cli-release-artifacts
          merge-multiple: true

      - name: List CLI release files
        run: find cli-release-artifacts -type f | sort

      - name: Upload CLI binaries to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          files: cli-release-artifacts/**/*

  notify-website-release:
    name: Sync installers to zagens.com
    needs: [gate, build-windows]
    if: needs.gate.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch website sync-release workflow
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.WEBSITE_REPO_DISPATCH_TOKEN }}
          repository: jjlin0603-svg/zagens_website
          event-type: desktop-release
          client-payload: '{"tag": "${{ needs.gate.outputs.tag }}"}'
