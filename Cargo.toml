[workspace]
members = [
    "crates/agent",
    "crates/config",
    "crates/core",
    "crates/hooks",
    "crates/mcp",
    "crates/protocol",
    "crates/runtime-adapters",
    "crates/runtime-api",
    "crates/runtime-orchestrator",
    "crates/runtime-server",
    "crates/secrets",
    "crates/tools",
    "crates/topic-memory",
    "crates/desktop",
    "crates/windows-sandbox",
]
default-members = ["crates/runtime-server"]
resolver = "2"

[workspace.package]
version = "0.7.5"
edition = "2024"
# Rust 1.88 stabilized `let_chains` in `if`/`while` conditions, which the
# codebase relies on extensively. Cargo enforces this so users on older
# toolchains get a clear "package requires rustc 1.88+" error instead of a
# confusing E0658 from rustc. Dev/CI pin: rust-toolchain.toml (currently 1.96).
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/didclawapp-ai/zagens"
homepage = "https://github.com/didclawapp-ai/zagens"
readme = "README.md"
# Full license text: LICENSE. Runtime lineage attribution: NOTICE.md, third-party/deepseek-tui/.

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.5", features = ["json"] }
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5"
dirs = "6.0.0"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.7"
sha2 = "0.10"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4"] }
ratatui = "0.29.0"
crossterm = "0.28.1"
